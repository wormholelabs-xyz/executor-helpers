[toolchain]
package_manager = "yarn"
rust_version = "1.79.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
relay_cost_protection = "9iewH6V2wQaFPPESB7XTGdzWZ9L3P51RTqUBHrxk6ccX"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
