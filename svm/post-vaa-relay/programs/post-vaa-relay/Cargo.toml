[package]
name = "post-vaa-relay"
version = "0.1.0"
description = "CPI relay into the Wormhole core bridge post_vaa instruction with signature_set downgraded to read-only, so it can share a transaction with verify_signatures."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "post_vaa_relay"

# Exactly one network feature must be enabled. It selects the core bridge
# program id the relay accepts as CPI target.
[features]
default = []
mainnet = []
# Wormhole "testnet" is the Solana devnet cluster.
testnet = []
localnet = []

[dependencies]
pinocchio = "=0.9.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
base64 = "=0.22.1"
mollusk-svm = "=0.15.1"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
solana-account = "=4.3.2"
solana-hash = "=4.5.0"
solana-instruction = "=3.4.1"
solana-instruction-error = "=2.4.0"
solana-keccak-hasher = "=3.1.0"
solana-keypair = "=3.1.2"
solana-message = { version = "=4.4.1", features = ["wincode"] }
solana-program-error = "=3.0.1"
solana-pubkey = { version = "=4.2.1", features = ["curve25519"] }
solana-sdk-ids = "=3.1.0"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.5", features = ["wincode"] }
wincode = "=0.5.5"
