[package]
name = "post-vaa-relay"
version = "0.1.0"
description = "Throwaway devnet proof: CPIs into the Wormhole core bridge's post_vaa, downgrading signature_set to read-only so it can share a transaction with verify_signatures."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "post_vaa_relay"

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = "0.9.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
